version: '3.8'

services:
  bot:
    build: .
    container_name: file_convert_pro
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./tmp:/app/tmp
      - ./bot.db:/app/bot.db
    depends_on:
      - telegram-bot-api
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: always
    environment:
      TELEGRAM_API_ID: "Sizning_API_ID"
      TELEGRAM_API_HASH: "Sizning_API_HASH"
      TELEGRAM_LOCAL: "1"
    volumes:
      - ./tg-data:/var/lib/telegram-bot-api
    command: ["--api-id=Sizning_API_ID", "--api-hash=Sizning_API_HASH", "--local"]
    expose:
      - "8081"